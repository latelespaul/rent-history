# =============================================================================
# application-docker.yaml — Local Docker Compose environment
# =============================================================================
# Activated via SPRING_PROFILES_ACTIVE=docker when running `docker compose up`.
#
# Assumes PostgreSQL container named "postgres" on the compose network.
# All values are local-only throwaway credentials — never use in production.
# =============================================================================

spring:
  # ── DataSource (containerized Postgres) ─────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:rentrix}
    username: ${DB_USERNAME:rentrix}
    password: ${DB_PASSWORD:rentrix123}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: RentrixHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update          # dev-friendly; never use in prod
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ── Jackson ────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null

# ── JWT configuration ────────────────────────────────────────────────────────
# Local-only secret. Real deployments (Render prod) MUST use JWT_SECRET env var.
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-jwt-secret-32-chars-minimum-abcdefgh}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ── Swagger / OpenAPI (enabled for local exploration) ────────────────────────
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.rentrix: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN