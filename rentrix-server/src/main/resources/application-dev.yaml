# =============================================================================
# dev profile: local development. Needs nothing but Java 21.
#   SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run
# Add SEED_DEMO=true for demo homes on an empty database (seed/DemoSeeder).
# SQLite file under ./data, Swagger UI on, built-in JWT secret (dev only).
# =============================================================================
server:
  address: ${SERVER_BIND:127.0.0.1}

spring:
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/rentrix.db}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.rentrix: DEBUG

app:
  jwt:
    # Dev-only value, public in git. Any profile other than dev/test needs a real JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-jwt-secret-not-for-production-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  web:
    base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}       # emails go to this log (DEBUG shows the body), never to Resend
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:true}
  admin-console:
    hosts: ${ADMIN_HOSTS:admin.localhost}   # the admin console on http://admin.localhost:5173 (§13.3)
  identity:
    # Dev-only value, public in git. Any profile other than dev/test sets its own ID_HASH_KEY.
    hash-key: ${ID_HASH_KEY:dev-only-id-hash-key-not-for-production-0123456789}
  truecaller:
    # Dev-only placeholder key: FakeTruecallerVerifier reads the access token "fake:<phone>" as a verified
    # number and never calls Truecaller.
    app-key: ${TRUECALLER_APP_KEY:dev-only-fake-truecaller-key}
    fake: ${TRUECALLER_FAKE:true}
  telegram-gateway:
    # FakeTelegramGateway: Telegram is the default phone method, nothing is sent; the code goes to
    # the admin relay when SMS_BACKEND=admin-relay, else to this log.
    fake: ${TELEGRAM_GATEWAY_FAKE:true}
  sms:
    backend: ${SMS_BACKEND:log}   # OTP codes go to the API log, never to a phone
