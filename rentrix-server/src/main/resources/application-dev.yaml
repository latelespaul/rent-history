server:
  # Bind to all interfaces so mobile devices on the same LAN can reach the API
  address: 0.0.0.0

spring:
  # ==================== H2 DATASOURCE ====================
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ==================== JPA ====================
  jpa:
    hibernate:
      ddl-auto: create-drop  # create-drop for dev, create for testing
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  # ==================== H2 CONSOLE ====================
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false  # Only localhost access
        trace: false

  # ── CORS (Vite default + LAN testing) ────────────────────────────────────────
  app:
    cors:
      allowed-origins: http://localhost:5173,http://localhost:8080/swagger-ui/index.html

# ── Dev-only Actuator override ────────────────────────────────────────────────
management:
  endpoint:
    health:
      show-details: always

# ── Swagger / OpenAPI (disabled in prod) ─────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true