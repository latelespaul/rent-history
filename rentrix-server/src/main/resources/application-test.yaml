# =============================================================================
# test profile: automated tests and CI. Each Spring context gets a fresh SQLite
# file under target/, migrated by Flyway (no create-drop schema).
# =============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlite:target/test-data/rentrix-${random.uuid}.db}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.rentrix: INFO

app:
  jwt:
    # Test-only value, public in git.
    secret: ${JWT_SECRET:test-only-jwt-secret-not-for-production-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}
  auth:
    google:
      # Not a real client id: tests use FakeGoogleTokenVerifier and never call Google (D-75).
      client-id: ${GOOGLE_CLIENT_ID:fake-test-client-id}
  scheduling:
    enabled: false              # tests call jobs directly
