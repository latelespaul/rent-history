# =============================================================================
# test profile: automated tests and CI. Each Spring context gets a fresh SQLite
# file under target/, migrated by Flyway (no create-drop schema).
# =============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlite:target/test-data/rentrix-${random.uuid}.db}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.rentrix: INFO

app:
  jwt:
    # Test-only value, public in git.
    secret: ${JWT_SECRET:test-only-jwt-secret-not-for-production-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  web:
    base-url: ${APP_BASE_URL:http://localhost:5173}
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}
  admin-console:
    hosts: ${ADMIN_HOSTS:admin.localhost}   # the admin console on http://admin.localhost:5173 (§13.3)
  auth:
    google:
      # Not a real client id: tests use FakeGoogleTokenVerifier and never call Google (D-75).
      client-id: ${GOOGLE_CLIENT_ID:fake-test-client-id}
  scheduling:
    enabled: false              # tests call jobs directly
  documents:
    # Test-only value, public in git. Any profile other than dev/test sets its own DOCUMENT_ENCRYPTION_KEY.
    encryption-key: ${DOCUMENT_ENCRYPTION_KEY:test-only-document-key-not-for-production-0123456789}
  storage:
    # One folder for the test run: keys are random, so contexts never clash (a ${random.uuid} here
    # would resolve anew on every read, so beans would disagree on the folder).
    local-dir: ${STORAGE_LOCAL_DIR:target/test-data/media}
  identity:
    # Test-only value, public in git. Any profile other than dev/test sets its own ID_HASH_KEY.
    hash-key: ${ID_HASH_KEY:test-only-id-hash-key-not-for-production-0123456789}
  truecaller:
    # Test-only placeholder key: FakeTruecallerVerifier reads the access token "fake:<phone>" as a verified
    # number and never calls Truecaller.
    app-key: ${TRUECALLER_APP_KEY:test-only-fake-truecaller-key}
    fake: ${TRUECALLER_FAKE:true}
  sms:
    backend: ${SMS_BACKEND:log}   # OTP codes go to the API log, never to a phone
