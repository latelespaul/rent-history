# =============================================================================
# Rentrix API: settings shared by every profile. All values come from env vars
# (12-factor). Defaults here are safe for production; dev and test add local
# defaults in their own files. See SYSTEM_DESIGN.md §17 for the full list.
#
# There is NO default profile: SPRING_PROFILES_ACTIVE must be dev, test or prod
# or the API refuses to start (D-64, config/StartupGuard).
# =============================================================================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  shutdown: graceful
  # Behind a reverse proxy (Caddy on the VM, Render): TRUSTED_PROXIES is a regex of proxy
  # IPs whose X-Forwarded-For / -Proto / -Host / -Port are honoured (Tomcat RemoteIpValve).
  # The API then sees the public scheme, host and port, so a same-origin browser call
  # (Origin = the public origin) is not treated as cross-origin CORS, and the sign-in rate
  # limit keys on the real client IP. Any other peer's forwarded headers are ignored, so a
  # client cannot pick its IP or origin. Default: loopback and private ranges (a proxy on
  # the same host or Docker network).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${TRUSTED_PROXIES:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}'

spring:
  application:
    name: rentrix-server
  main:
    banner-mode: off

  # --- Database (D-09): DB_URL picks SQLite, MySQL or PostgreSQL ----------------
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: rentrix
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema (D-10)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # D-14
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    # db/vendor/{vendor} holds the few vendor-only files (D-10): {vendor} is the JDBC driver id
    # (sqlite, mysql, postgresql), and a vendor without a folder simply has none.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    validate-on-migrate: true

  jackson:
    time-zone: UTC

  # Uploads (rental agreements, D-131): the API refuses a file over 10 MB itself with a clear
  # message; these limits only stop a far larger request before it is read.
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

# --- Ops (health, readiness) ---------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true             # /actuator/health/liveness and /readiness
      group:
        readiness:
          include: readinessState,db

# --- OpenAPI: only dev and test switch it on (D-64) ----------------------------
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# --- Logs: one JSON object per line (ECS), with the request id as traceId -------
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: INFO
    com.rentrix: INFO
    org.hibernate: WARN

# --- Application ---------------------------------------------------------------
app:
  brand:
    # The product name users see (emails, SMS, API messages, API docs title).
    name: Doorway Living
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m         # D-62
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}   # only dev/test may set true (D-77)
  auth:
    google:
      # GIS ID-token flow needs only the client id (D-74). Env only, never committed.
      client-id: ${GOOGLE_CLIENT_ID:}
    refresh-token-ttl: 30d                # D-63
    refresh-reuse-grace: 30s              # D-63: the last rotated token still answers this long (tabs racing)
    rate-limit:                           # POST /auth/google and /auth/dev-login, per client IP (§13)
      requests: 20
      period: 15m
  admin-console:
    # The admin console's own host (D-19, SYSTEM_DESIGN §13.3). Only requests to these host names
    # (Host, or X-Forwarded-Host from TRUSTED_PROXIES) may sign in as an admin or call /admin/**;
    # the main site never sees the admin role. Empty = no admin console.
    hosts: ${ADMIN_HOSTS:}                # comma list, e.g. admin.doorwayliving.in
    emails: ${ADMIN_CONSOLE_EMAILS:}      # comma list of verified Google emails allowed to sign in there
  web:
    # Public URL of the web app, for links in emails (tenancy invites, D-65).
    base-url: ${APP_BASE_URL:}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}   # in-process jobs behind scheduled_job_lock (D-08)
  seed:
    demo: ${SEED_DEMO:false}              # demo data, dev profile + empty DB only (D-68)
  ratings:
    # Which published reviews the headline ratings count (D-135): "all" until admins can give the
    # green tick (PLAN W9), then "verified" (green-tick reviews only). After a switch the stored
    # aggregates are rebuilt by the nightly repair (D-33, RatingRecomputer.recomputeAll).
    headline: ${RATINGS_HEADLINE:all}
  identity:
    # HMAC key for phone numbers, PAN and OTP codes (D-101, D-106). Env only, >= 32 bytes.
    hash-key: ${ID_HASH_KEY:}
    otp-ttl: ${OTP_TTL_MINUTES:10}m       # phone OTP lifetime (D-101)
    # Test phone numbers (+91 99999 0xxxx): codes held for the admin relay and log only, never sent
    # by SMS, the Telegram Gateway or the relay's Telegram push. E2E and release gates use only these.
    otp-test-number-prefix: ${OTP_TEST_NUMBER_PREFIX:+91999990}
  # Preview deployment flag (D-137): allows SMS_BACKEND=admin-relay under prod. Off = live mode.
  preview-mode: ${PREVIEW_MODE:false}
  truecaller:
    # Phone verification with Truecaller on Android mobile web (identity/TruecallerService). One
    # Truecaller web app per deployment; env only, never committed or logged. No key = no button.
    # Truecaller posts to <API>/api/v1/auth/truecaller/callback (registered with the app).
    enabled: ${TRUECALLER_ENABLED:true}
    app-key: ${TRUECALLER_APP_KEY:}
    app-name: ${TRUECALLER_APP_NAME:}
    fake: ${TRUECALLER_FAKE:false}          # dev/test only: FakeTruecallerVerifier, no Truecaller call
  telegram-gateway:
    # Phone codes through the Telegram Gateway API (identity/PhoneOtpService, D-146): Telegram shows
    # the code in the user's Telegram app. Env only, never committed or logged. No token = no
    # Telegram option; with one, Telegram is the default phone method and SMS the fallback.
    token: ${TELEGRAM_GATEWAY_TOKEN:}
    fake: ${TELEGRAM_GATEWAY_FAKE:false}    # dev/test only: FakeTelegramGateway, no Telegram call
  storage:
    # Private documents on the API's disk (D-66, STORAGE_BACKEND=local, the only backend until PLAN
    # B9): files under <dir>/private, never served as static files. Put it on a persistent disk.
    local-dir: ${STORAGE_LOCAL_DIR:./data/media}
  documents:
    # AES-256-GCM key for private documents at rest (rental agreements, D-131), and for their 5-minute
    # signed download links. Secret: env only, never committed or logged, >= 32 bytes. Required
    # outside dev/test: the API refuses to start without it.
    encryption-key: ${DOCUMENT_ENCRYPTION_KEY:}
  agreements:
    # D-127: "manual" (the uploader types the fields) is the only extractor; no OCR or LLM is built.
    extractor: ${AGREEMENT_EXTRACTOR:manual}
    # D-131: days after the later of the team's decision and the other party's confirmation before
    # the file is deleted (90 days after upload while no other party has confirmed it).
    file-retention-days: ${AGREEMENT_FILE_RETENTION_DAYS:30}
  sms:
    # Phone OTP only (D-101). Empty = no SMS: the phone method is unavailable (503
    # phone_otp_unavailable) and the API still starts. "http" needs SMS_HTTP_URL and
    # SMS_API_KEY; "log" (writes the code to the log) is refused outside dev/test;
    # "admin-relay" (preview: codes shown to admins, D-137) needs PREVIEW_MODE=true in prod.
    backend: ${SMS_BACKEND:}
    http:
      url: ${SMS_HTTP_URL:}
      api-key: ${SMS_API_KEY:}
      sender-id: ${SMS_SENDER_ID:}
    # Optional with "admin-relay" (D-137): also push each held code to these Telegram chats.
    # Both must be set; the token is secret (env only, never logged). Chat ids: comma list.
    telegram:
      bot-token: ${ADMIN_RELAY_TELEGRAM_BOT_TOKEN:}
      chat-id-list: ${ADMIN_RELAY_TELEGRAM_CHAT_IDS:}
