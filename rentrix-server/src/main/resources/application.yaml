# =============================================================================
# Rentrix API: settings shared by every profile. All values come from env vars
# (12-factor). Defaults here are safe for production; dev and test add local
# defaults in their own files. See SYSTEM_DESIGN.md §17 for the full list.
#
# There is NO default profile: SPRING_PROFILES_ACTIVE must be dev, test or prod
# or the API refuses to start (D-64, config/StartupGuard).
# =============================================================================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  shutdown: graceful

spring:
  application:
    name: rentrix-server
  main:
    banner-mode: off

  # --- Database (D-09): DB_URL picks SQLite, MySQL or PostgreSQL ----------------
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: rentrix
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema (D-10)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # D-14
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    time-zone: UTC

# --- Ops (health, readiness) ---------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true             # /actuator/health/liveness and /readiness
      group:
        readiness:
          include: readinessState,db

# --- OpenAPI: only dev and test switch it on (D-64) ----------------------------
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# --- Logs: one JSON object per line (ECS), with the request id as traceId -------
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    root: INFO
    com.rentrix: INFO
    org.hibernate: WARN

# --- Application ---------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m         # D-62
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}   # only dev/test may set true (D-77)
