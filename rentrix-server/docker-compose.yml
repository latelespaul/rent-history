services:

  mysql:
    image: mysql:8.4
    container_name: rentrix-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rentrix_root_123
      MYSQL_DATABASE: rentrix
      MYSQL_USER: rentrix
      MYSQL_PASSWORD: rentrix123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u rentrix -prentrix123" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  rentrix-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentrix-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rentrix
      DB_USERNAME: rentrix
      DB_PASSWORD: rentrix123
      JWT_SECRET: local-dev-jwt-secret-32-chars-minimum-xxxxxxxx
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data: