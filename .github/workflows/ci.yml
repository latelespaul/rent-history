name: CI

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rentrix-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Tests
        run: mvn test

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: rentrix-server/target/surefire-reports

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rentrix-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rentrix-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
  docker-images:
    name: Docker Images & Compose Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
        run: docker compose build

      - name: Start stack
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/actuator/health/readiness)
          echo "API readiness: $code"
          test "$code" = 200
          curl -fsS http://localhost:8081/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8081/config.js | tee /dev/stderr | grep -q 'apiBaseUrl: "http://localhost:8080/api/v1"'
          # client-side routes fall back to index.html
          curl -fsS http://localhost:8081/some/client/route | grep -q '<div id="root">'

      - name: Logs on failure
        if: failure()
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        env:
          JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
        run: docker compose down -v
