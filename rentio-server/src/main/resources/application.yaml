spring:
  application:
    name: rent-history
  # -------------------- DATASOURCE (MySQL) --------------------
  datasource:
    # Connection URL with common parameters
    url: jdbc:mysql://localhost:3306/homerental?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}          # Environment variable with fallback
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: MySQLHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000                 # 5 minutes
      connection-timeout: 20000            # 20 seconds
      max-lifetime: 1800000                # 30 minutes
      leak-detection-threshold: 60000      # 1 minute

  # -------------------- JPA / Hibernate (MySQL) --------------------
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update                     # Use 'validate' in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false